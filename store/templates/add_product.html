{% extends "base.html" %}

{% block content %}
<div class="container mt-5 mb-5" style="max-width: 800px;">
    <div class="card shadow-sm border-0">
        <div class="card-body p-5">
            <h2 class="fw-bold mb-4 text-center">Add New Product</h2>
            
            <form action="{% url 'add_product' %}" method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                
                {{ form.as_p }}
                
                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-dark py-3 fw-bold">Upload Product</button>
                    <a href="{% url 'home' %}" class="btn btn-outline-secondary py-2">Cancel</a>
                </div>
            </form>
            
        </div>
    </div>
</div>
{% endblock %}
