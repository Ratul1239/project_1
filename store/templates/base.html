<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Iconic Cloth{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    
    <style>
        body { font-family: Arial, sans-serif; }
        .top-promo { background-color: #000; color: #fff; font-size: 11px; padding: 10px 0; }
        .main-header { background-color: #000; color: #fff; padding: 20px 0; }
        .brand-title { font-size: 36px; font-weight: bold; margin: 0; }
        .brand-subtitle { font-size: 11px; letter-spacing: 4px; color: #ccc; }
        .nav-menu { background-color: #000; padding-bottom: 25px; }
        .nav-menu a { color: #ccc; margin: 0 12px; font-size: 12px; }
        .nav-menu a:hover { color: #fff; }
    </style>
</head>

<body>

<div class="top-promo text-center">
    CASH ON DELIVERY ALL OVER BANGLADESH 🚀
</div>

<div class="main-header">
    <div class="container d-flex justify-content-between align-items-center">
        <div>
    <form action="{% url 'search' %}" method="GET" class="d-flex align-items-center">
        <input type="text" name="keyword" class="form-control form-control-sm me-2" placeholder="Search products..." style="background: transparent; color: white; border: 1px solid #555; width: 200px;">
        <button type="submit" style="background: none; border: none; color: white;">
            <i class="bi bi-search fs-5"></i>
        </button>
    </form>
</div>

        <div class="text-center">
            <h1 class="brand-title">Iconic Cloth</h1>
            <div class="brand-subtitle">CLASSIC MENSWEAR</div>
        </div>

        <div style="cursor: pointer;" class="d-flex align-items-center">
                <i class="bi bi-person fs-4 me-4 text-white"></i>
                
                <a href="{% url 'cart' %}" class="text-white text-decoration-none position-relative">
                    <i class="bi bi-bag fs-4"></i>
                    <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="font-size: 10px;">
                        {{ cart_count }}
                    </span>
                </a>
            </div>
    </div>
</div>

<div class="nav-menu text-center">
        <a href="{% url 'home' %}">ALL PRODUCTS</a>
        {% for category in all_categories %}
            <a href="{% url 'products_by_category' category.slug %}">{{ category.category_name|upper }}</a>
        {% endfor %}
    </div>

<!-- ✅ MAIN CONTENT -->
{% block content %}

{% endblock %}

</body>
</html>
