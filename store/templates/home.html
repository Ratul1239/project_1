{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <div class="row">
        {% for product in products %}
        <div class="col-lg-3 col-md-4 col-sm-6 mb-5">
           
                
                <div class="product-item">
                    <img src="{{ product.images.url }}" class="rounded shadow-sm" style="width:100%; height:300px; object-fit:cover;" alt="{{ product.product_name }}">
                    
                    <h6 class="mt-3 fw-bold">{{ product.product_name }}</h6>
                    
                    <div class="d-flex justify-content-between align-items-center mt-2">
                        <p class="mb-0 fw-bold text-danger fs-5">৳{{ product.price }}</p>
                         <a href="{% url 'product_detail' product.category.slug product.slug %}" style="text-decoration:none; color:black;">
                        <p class="mb-0 fw-bold text-primary">Order Now</p>
                        </a>
                    </div>
                </div>

           
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
