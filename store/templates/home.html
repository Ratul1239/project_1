{% extends "base.html" %}

{% block content %}

<div class="container mt-4">
    
    <div class="row">
        {% for product in products %}
        <div class="col-lg-3 col-md-4 col-sm-6 mb-5">
            <a href="{% url 'product_detail' product.category.slug product.slug %}" style="text-decoration:none;color:black;">
                
                <div>
                    <img src="{{ product.images.url }}" style="width:100%; height:300px; object-fit:cover;">
                    
                    <h6 class="mt-2">{{ product.product_name }}</h6>
                    <p>৳{{ product.price }}</p>
                </div>

            </a>
        </div>
        {% endfor %}
    </div>

</div>

{% endblock %}
